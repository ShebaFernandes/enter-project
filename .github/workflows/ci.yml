name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.8.22", enable-cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json}
      - run: uv sync --all-groups --frozen
        working-directory: app
      - run: npm ci
        working-directory: app
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy config modules
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: uv run python manage.py makemigrations --check --dry-run
        working-directory: app
      - run: uv run pytest -m "not postgres" --cov=config --cov=modules --cov-report=xml
        working-directory: app
      - run: uv run bandit -q -r config modules && uv run pip-audit
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: quality-evidence, path: "app/{coverage.xml,test-results}/", retention-days: 35}

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_DB: enter_test, POSTGRES_USER: enter, POSTGRES_PASSWORD: enter}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U enter -d enter_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://enter:enter@127.0.0.1:5432/enter_test
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.8.22", enable-cache: true}
      - run: uv sync --all-groups --frozen
        working-directory: app
      - run: uv run pytest tests/contract tests/database tests/security
        working-directory: app

  browser-accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: app/package-lock.json}
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:browser
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-accessibility-evidence, path: app/{playwright-report,test-results}/, retention-days: 35}

  security-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --check ./app
      - run: docker compose config --quiet
      - run: echo "DAST and IaC scans are release-gated when deployable targets exist."
