      required: [internal_state, publication_state, public_fields, public_url, source_version, source_etag, projection_version, preview_digest]
      properties:
        internal_state: {type: string, enum: [DRAFT, OPEN, PAUSED, CLOSED]}
        publication_state: {type: string, enum: [UNPUBLISHED, PUBLISHED]}
        public_url: {type: [string, 'null'], pattern: '^/roles/[a-f0-9-]+/$'}
        source_version: {type: integer, minimum: 1}
        source_etag: {type: string}
        projection_version: {type: integer, minimum: 0}
        preview_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        public_fields:
          type: object
          additionalProperties: false
          required: [id, title, description, location, work_mode, employment_type, published_at, closes_at, application_url]
          properties:
            id: {$ref: '#/components/schemas/Id'}
            title: {type: string}
            description: {type: string}
            location: {type: string}
            work_mode: {type: string}
            employment_type: {type: string}
            published_at: {type: 'null', description: Assigned by the server at confirmation.}
            closes_at: {type: [string, 'null'], format: date-time}
            application_url: {type: string, pattern: '^/roles/[a-f0-9-]+/$'}
    PublicOpeningSummary:
      type: object
      additionalProperties: false
      required: [id, title, description, location, work_mode, employment_type, published_at, closes_at, application_url]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        title: {type: string}
        location: {type: string}
        work_mode: {type: string}
        employment_type: {type: string}
        description: {type: string}
        published_at: {type: string, format: date-time}
        closes_at: {type: [string, 'null'], format: date-time}
        application_url: {type: string, pattern: '^/roles/[a-f0-9-]+/$'}
    RecentSearch:
      type: object
      additionalProperties: false
      required: [search_id, prompt, criteria, created_at, expires_at]
      properties:
        search_id: {$ref: '#/components/schemas/Id'}
        prompt: {type: string, maxLength: 4000}
        criteria: {$ref: '#/components/schemas/SearchCriteria'}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
      description: Sole context is criteria.context and must be AD_HOC for recents. No top-level opening_id, result data, contacts, notes or candidate identifiers.
    SavedSearch:
      type: object
      required: [id, name, search_id, prompt, criteria, version]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string, minLength: 1, maxLength: 200}
