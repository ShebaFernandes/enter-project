              evidence_id: {$ref: '#/components/schemas/Id'}
              label: {type: string}
              provenance: {type: string, enum: [CANDIDATE_REPORTED, RESUME_ACCEPTED, APPLICATION]}
        findings:
          type: array
          items: {$ref: '#/components/schemas/CandidateFinding'}
        unknowns: {type: array, items: {type: string}}
        explanation: {type: [string, 'null']}
    OpeningPublicationPreview:
      type: object
