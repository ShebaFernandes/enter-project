  /tenants/{tenantId}/openings/{openingId}/publication/publish:
    post:
      tags: [Recruiting]
      operationId: confirmOpeningPublication
      description: Confirm create/update of the existing projection. Requires opening.write, active OPEN source and business unit, non-expired projection, literal confirmation and current tenant/opening/version/public-value-bound opaque digest. Locked source and membership revalidation occurs before idempotent replay. Source version advances; source state does not. Atomic minimized audit required. Cache-Control no-store.
