        criteria: {$ref: '#/components/schemas/SearchCriteria'}
        result_context: {type: object}
        changed_since_save: {type: array, items: {type: string}}
        version: {type: integer, minimum: 1}
      additionalProperties: false
      description: criteria.context is the sole authoritative search context; no independent opening_id is accepted or exposed.
    CandidateDetail:
      type: object
      required: [candidate_id, permitted_fields, evidence, findings, unknowns]
      properties:
        candidate_id: {$ref: '#/components/schemas/Id'}
