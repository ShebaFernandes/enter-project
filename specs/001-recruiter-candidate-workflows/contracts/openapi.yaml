    CandidateFinding:
      type: object
      required: [id, code, severity, informational_only, message, evidence, calculation_version, evaluated_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        code: {const: SHORT_TENURE}
        severity: {const: INFORMATIONAL}
        informational_only: {const: true}
        message: {type: string, minLength: 1, maxLength: 500}
        evidence: {$ref: '#/components/schemas/ShortTenureEvidence'}
        calculation_version: {type: string, minLength: 1, maxLength: 100}
        evaluated_at: {type: string, format: date-time}
      additionalProperties: false
      description: Returned only after current tenant/object/purpose/visibility/field authorization. It is presentation-only and never affects eligibility, score, rank, recommendation, application status, or hiring outcome.
      example:
        id: 018f62f4-7c42-7e8a-b810-0a65d77be410
        code: SHORT_TENURE
        severity: INFORMATIONAL
        informational_only: true
        message: Candidate left XYZ Company after approximately 8 months.
        evidence:
          employment_record_id: 018f62f4-7c42-7e8a-b810-0a65d77be411
          company: XYZ Company
          confirmed_start_date: '2025-01-01'
          confirmed_end_date: '2025-09-01'
          calculated_duration: {calendar_months: 8, remaining_days: 0}
          calculation_version: short-tenure-v1
          evaluated_at: '2026-09-29T10:00:00Z'
        calculation_version: short-tenure-v1
        evaluated_at: '2026-09-29T10:00:00Z'
    ShortTenureEvidence:
      type: object
      required: [employment_record_id, company, confirmed_start_date, confirmed_end_date, calculated_duration, calculation_version, evaluated_at]
      properties:
        employment_record_id: {$ref: '#/components/schemas/Id'}
        company: {type: string, minLength: 1, maxLength: 300}
        confirmed_start_date: {type: string, format: date}
        confirmed_end_date: {type: string, format: date}
        calculated_duration:
          type: object
          required: [calendar_months, remaining_days]
          properties:
            calendar_months: {type: integer, minimum: 0, maximum: 11}
            remaining_days: {type: integer, minimum: 0, maximum: 30}
          additionalProperties: false
        calculation_version: {type: string, minLength: 1, maxLength: 100}
        evaluated_at: {type: string, format: date-time}
      additionalProperties: false
