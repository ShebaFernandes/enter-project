        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/OpeningId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmed, preview_digest]
              properties:
                confirmed: {type: boolean, const: true}
                preview_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '200':
          description: Confirmed publication or authorized identical replay. Replay is scoped by actor, tenant, opening, action, body and If-Match. Refresh status after uncertain results.
