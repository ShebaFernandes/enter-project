openapi: 3.1.0
info:
  title: Recruiter and Candidate Workflow API
  version: 1.2.0
  description: >-
    Same-origin API contract for the Django-hosted application. Authentication uses a secure
    HttpOnly application session; unsafe methods also require CSRF protection. All protected
    operations are authorized by actor, tenant, object, purpose, consent, and field scope.
    Protected operations return non-enumerating 401/403/404 problems as applicable. Unsafe
    operations additionally declare 409 conflicts, 422 validation failures, 429 temporary limits,
    and 503 safe-degradation responses when those outcomes are possible.
servers:
  - url: /api/v1
security:
  - applicationSession: []
tags:
  - name: Identity
  - name: Candidate
  - name: Recruiting
  - name: Search
  - name: Administration
paths:
  /tenants/{tenantId}/search-handoffs/{kind}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: kind
        in: path
        required: true
        schema: {type: string, enum: [criteria-review, search-results, comparison-selection]}
      - name: X-Workflow-Handoff
        in: header
        description: Required on read/revise/revoke; random target-bound bearer, never logged.
        schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    post:
      operationId: createTypedSearchHandoff
      tags: [Search]
      description: CSRF and active session required. Body must match the path kind. Criteria review accepts workflow_id with criteria, or only search_id for an owned unexpired recent/saved search reopened into a fresh review checkpoint. Results accept search_id, optional page and criteria_token. Comparison selection is ordered, source-result-bound and freshly authorized. Fifteen-minute maximum lifetime. Retry reuses one record and rotates the bearer; only token hashes are persisted. No arbitrary return URL or JSON accepted.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 16, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [workflow_id, criteria]
                  properties:
                    workflow_id: {$ref: '#/components/schemas/Id'}
                    criteria: {$ref: '#/components/schemas/SearchCriteria'}
                - type: object
                  additionalProperties: false
                  required: [search_id]
                  properties:
                    search_id: {$ref: '#/components/schemas/Id'}
                    criteria_token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
                    page: {type: integer, minimum: 1, default: 1}
                - type: object
                  additionalProperties: false
                  required: [search_id, candidate_ids]
                  properties:
                    search_id: {$ref: '#/components/schemas/Id'}
                    candidate_ids: {$ref: '#/components/schemas/OrderedSelection'}
      responses:
        '201': {$ref: '#/components/responses/HandoffCreated'}
        '200': {$ref: '#/components/responses/HandoffCreated'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
    get:
      operationId: restoreTypedSearchHandoff
      tags: [Search]
      description: Revalidates actor, tenant, current session credential, target, role, source version/ownership, expiry/state and opening/team scope. Comparison also revalidates source-result membership and current candidate consent/visibility/field scope. Does not execute a search or return candidate content. Concealed denial for invalid binding/state. Cache-Control no-store, private.
      responses:
        '200':
          description: Typed authorized state only
          headers:
            Cache-Control: {schema: {type: string, const: 'no-store, private'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HandoffState'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      operationId: reviseTypedSearchHandoff
      tags: [Search]
      description: CSRF and If-Match required. Only criteria-review criteria or comparison-selection ordered candidate IDs may change; results are immutable. Fresh authorization; stale version returns 409 without protected attempted values.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [criteria]
                  properties:
                    criteria: {$ref: '#/components/schemas/SearchCriteria'}
                - type: object
                  additionalProperties: false
                  required: [candidate_ids]
                  properties:
                    candidate_ids: {$ref: '#/components/schemas/OrderedSelection'}
      responses:
        '200':
          description: Updated typed state; private no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HandoffState'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      operationId: revokeTypedSearchHandoff
      tags: [Search]
      description: CSRF, current bound session and If-Match required; revocation is final.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: {type: string}
      responses:
        '204': {description: Revoked; private no-store}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /tenants/{tenantId}/search-handoffs/search-results/page:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: X-Workflow-Handoff
        in: header
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    post:
      operationId: continueSearchResultHandoff
      tags: [Search]
      description: CSRF-protected empty-body continuation. Revalidates the bound source and issues a separate opaque results token for the next cumulative display page; never executes a new search. Original tokens preserve Back/refresh. Expiry cannot exceed the source handoff. Out-of-range returns 422. No-store.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 16, maxLength: 200}
      responses:
        '201': {$ref: '#/components/responses/HandoffCreated'}
        '200': {$ref: '#/components/responses/HandoffCreated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /tenants/{tenantId}/search-handoffs/comparison-selection/return:
    post:
      operationId: returnComparisonToAuthorizedResults
      tags: [Search]
      description: CSRF required; no request payload accepted. Revalidate comparison context and issue a distinct results token with no later expiry. Return a server-generated same-origin approved results route with opaque fragments only; never accept or persist a return URL.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: X-Workflow-Handoff
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 16, maxLength: 200}
      responses:
        '200':
          description: Private no-store return navigation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [return_path]
                properties:
                  return_path: {type: string, pattern: '^/tenants/[^/]+/recruiter/search/\?view=results#handoff=[A-Za-z0-9_-]{43}&selection=[A-Za-z0-9_-]{43}$'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /tenants/{tenantId}/search-handoffs/search-results/display:
    get:
      operationId: displayAuthorizedPersistedResults
      tags: [Search]
      description: Separate from metadata restore. Read only persisted snapshot membership in order, freshly rechecking current visibility/consent and existing result field projection. Never execute a new search, persist candidate copies or change recruiting records. Private no-store.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: X-Workflow-Handoff
          in: header
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        '200':
          description: Currently authorized snapshot display
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [search_id, items, next_cursor]
                properties:
                  search_id: {$ref: '#/components/schemas/Id'}
                  items: {type: array, items: {$ref: '#/components/schemas/SearchResult'}}
                  next_cursor: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /public/openings:
    get:
      security: []
      tags: [Recruiting]
      operationId: listPublicOpenings
      description: Read-only active, published, unexpired PublicOpeningProjection rows; never query tenant-scoped openings anonymously. IDs are independent public UUIDs. No tenant/source IDs or private data. Stable public id ascending cursor ordering; revalidate each request. Cache-Control no-store.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 2048}
      responses:
        '200':
          description: Public role essentials; empty items when none are available
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                additionalProperties: false
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/PublicOpeningSummary'}}
                  next_cursor: {type: [string, 'null']}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
  /tenants/{tenantId}/recent-searches:
    get:
      tags: [Search]
      operationId: listRecentSearches
      description: Current authorized actor and tenant only; at most six unexpired unsaved AD_HOC definitions, created_at descending then id descending. Excludes named saves and all candidate snapshots. GET does not refresh retention. Private no-store response.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Authorized recent criteria records
          headers:
            Cache-Control: {schema: {type: string, const: 'no-store, private'}}
          content:
            application/json:
              schema: {type: array, maxItems: 6, items: {$ref: '#/components/schemas/RecentSearch'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
  /tenants/{tenantId}/recent-searches/{searchId}:
    get:
      tags: [Search]
      operationId: restoreRecentSearchCriteria
      description: Revalidate current search role, active tenant membership, exact ownership, AD_HOC context, expiry and recent eligibility. Return criteria for review only; no search execution, result snapshot, write or retention refresh. Confirm using existing search execution endpoint. Named saves use the existing saved-search detail operation.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: searchId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: Authorized criteria; never historical candidate data
          headers:
            Cache-Control: {schema: {type: string, const: 'no-store, private'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecentSearch'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
  /session:
    get:
      tags: [Identity]
      operationId: getSession
      responses:
        '200':
          description: Current actor and effective tenant context
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Identity]
      operationId: signOut
      responses:
        '204': {description: Session ended}
  /candidate/profile:
    get:
      tags: [Candidate]
      operationId: getOwnProfile
      responses:
        '200':
          description: Candidate-owned profile
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateProfile'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Candidate]
      operationId: updateOwnProfile
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/CandidateProfilePatch'}
      responses:
        '200':
          description: Updated profile
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateProfile'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Problem'}
  /candidate/profile/publish:
    post:
      tags: [Candidate]
      operationId: publishOwnProfile
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Published profile
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateProfile'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Problem'}
  /candidate/visibility:
    put:
      tags: [Candidate]
      operationId: replaceOwnVisibility
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VisibilityChange'}
      responses:
        '200':
          description: Visibility changed and projections invalidated
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Visibility'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /candidate/rights-requests:
    get:
      tags: [Candidate]
      operationId: listOwnRightsRequests
      responses:
        '200':
          description: Candidate-visible rights request history and current state
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/RightsRequest'}
    post:
      tags: [Candidate]
      operationId: createRightsRequest
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RightsRequestCreate'}
      responses:
        '202':
          description: Request accepted; immediate actions have already taken effect where applicable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RightsRequest'}
        '422': {$ref: '#/components/responses/Problem'}
  /candidate/rights-requests/{rightsRequestId}:
    get:
      tags: [Candidate]
      operationId: getOwnRightsRequest
      parameters:
        - $ref: '#/components/parameters/RightsRequestId'
      responses:
        '200':
          description: Current request scope, status, timing, exception, and next action
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RightsRequest'}
        '404': {$ref: '#/components/responses/Problem'}
  /candidate/rights-requests/{rightsRequestId}/download:
    post:
      tags: [Candidate]
      operationId: createRightsExportDownload
      parameters:
        - $ref: '#/components/parameters/RightsRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Short-lived authenticated download for a complete export; request readiness and 24-hour artifact expiry are rechecked
        '409': {$ref: '#/components/responses/Problem'}
  /candidate/rights-requests/{rightsRequestId}/escalations:
    post:
      tags: [Candidate]
      operationId: escalateRightsRequest
      parameters:
        - $ref: '#/components/parameters/RightsRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '202': {description: Failed, disputed, inaccessible, or overdue request escalated without copying unnecessary candidate data}
        '409': {$ref: '#/components/responses/Problem'}
  /candidate/resumes/uploads:
    post:
      tags: [Candidate]
      operationId: createResumeUpload
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type, size_bytes, sha256]
              properties:
                filename: {type: string, maxLength: 255}
                content_type: {type: string, enum: [application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document]}
                size_bytes: {type: integer, minimum: 1, maximum: 10485760}
                sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
      responses:
        '201':
          description: Short-lived quarantine upload grant
          content:
            application/json:
              schema:
                type: object
                required: [resume_id, upload_url, expires_at]
                properties:
                  resume_id: {$ref: '#/components/schemas/Id'}
                  upload_url: {type: string, format: uri}
                  required_headers: {type: object, additionalProperties: {type: string}}
                  expires_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /candidate/resumes/{resumeId}:
    get:
      tags: [Candidate]
      operationId: getResumeProcessingState
      parameters:
        - $ref: '#/components/parameters/ResumeId'
      responses:
        '200':
          description: Resume scan, parse, and review state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResumeState'}
        '404': {$ref: '#/components/responses/Problem'}
  /candidate/applications:
    get:
      tags: [Candidate]
      operationId: listOwnApplications
      responses:
        '200':
          description: Candidate-owned applications with independent status histories
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Application'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Candidate]
      operationId: submitApplication
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opening_id, resume_id, answers, consent_record_id, notification_preferences]
              properties:
                opening_id: {$ref: '#/components/schemas/Id'}
                resume_id: {$ref: '#/components/schemas/Id'}
                answers: {type: object}
                consent_record_id: {$ref: '#/components/schemas/Id'}
                notification_preferences:
                  type: object
                  required: [email, whatsapp]
                  properties:
                    email: {type: boolean}
                    whatsapp: {type: boolean}
      responses:
        '201':
          description: Per-role application created exactly once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /candidate/applications/{applicationId}:
    get:
      tags: [Candidate]
      operationId: getOwnApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Candidate-facing application state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
        '404': {$ref: '#/components/responses/Problem'}
  /candidate/applications/{applicationId}/withdraw:
    post:
      tags: [Candidate]
      operationId: withdrawOwnApplication
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_status, confirm]
              properties:
                candidate_status: {const: WITHDRAWN}
                confirm: {const: true}
              additionalProperties: false
      responses:
        '200':
          description: Candidate-confirmed withdrawal published for this application
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /candidate/applications/{applicationId}/notification-preferences:
    put:
      tags: [Candidate]
      operationId: replaceOwnApplicationNotificationPreferences
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, whatsapp]
              properties:
                email: {type: boolean}
                whatsapp: {type: boolean}
      responses:
        '200': {description: Independent channel preferences saved}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /public/openings/{openingId}:
    get:
      security: []
      tags: [Recruiting]
      operationId: getPublicOpening
      parameters:
        - $ref: '#/components/parameters/OpeningId'
      responses:
        '200':
          description: Public essentials for an open role without tenant-private fields
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicOpeningSummary'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Problem'}
  /platform/tenants:
    post:
      tags: [Administration]
      operationId: provisionTenant
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contracted_company_name, legal_boundary_reference]
              properties:
                contracted_company_name: {type: string, minLength: 1, maxLength: 300}
                legal_boundary_reference: {type: string, minLength: 1, maxLength: 300}
      responses:
        '201': {description: Tenant provisioned by the separately authorized, audited platform-onboarding function}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /tenants/{tenantId}/business-units:
    get:
      tags: [Administration]
      operationId: listBusinessUnits
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Business units in the effective tenant
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/BusinessUnit'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Administration]
      operationId: createBusinessUnit
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 300}
                description: {type: string, maxLength: 2000}
      responses:
        '201':
          description: Tenant-owned organizational context created without changing isolation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BusinessUnit'}
