            application/json:
              schema: {$ref: '#/components/schemas/OpeningPublicationPreview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /tenants/{tenantId}/openings/{openingId}/publication/withdraw:
    post:
      tags: [Recruiting]
      operationId: withdrawOpeningPublication
      description: Confirm immediate projection deactivation without changing internal opening state. Requires current opening.write and If-Match. Atomic minimized audit and scoped idempotency; authorization is rechecked before replay. Cache-Control no-store.
