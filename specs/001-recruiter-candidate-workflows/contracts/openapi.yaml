        content:
          application/json:
            schema: {$ref: '#/components/schemas/DisclosureRequest'}
      responses:
        '200':
          description: Non-disclosing preview of destination, purpose, and currently permitted fields
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DisclosurePreview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /tenants/{tenantId}/candidates/{candidateId}/disclosures:
    post:
      tags: [Recruiting]
      operationId: confirmCandidateDisclosure
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CandidateId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_id, preview_hash, confirm]
              properties:
                preview_id: {$ref: '#/components/schemas/Id'}
                preview_hash: {type: string}
                confirm: {const: true}
      responses:
        '202': {description: Disclosure re-authorized at execution time and queued or handed off with visible state}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/SafeDegradation'}
  /tenants/{tenantId}/exports:
    post:
      tags: [Recruiting]
      operationId: requestExport
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': {description: Export queued for execution-time reauthorization}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /tenants/{tenantId}/audit-events:
    get:
      tags: [Administration]
      operationId: listRedactedTenantAuditEvents
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Role-filtered, redacted administrative audit metadata; the read is itself audited
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AuditEventSummary'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /tenants/{tenantId}/access-reviews:
    get:
      tags: [Administration]
      operationId: listAccessReviews
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Authorized access-review schedule and decisions without candidate content
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AccessReview'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Administration]
      operationId: createAccessReview
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccessReviewCreate'}
      responses:
        '201':
          description: Review population snapshotted and assigned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessReview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /tenants/{tenantId}/access-reviews/{accessReviewId}/complete:
    post:
      tags: [Administration]
      operationId: completeAccessReview
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/AccessReviewId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions: {type: array, minItems: 1, items: {type: object}}
      responses:
        '200':
          description: Review completed and required revocations/exceptions recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessReview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /administration/emergency-access-requests:
    post:
      tags: [Administration]
      operationId: requestEmergencyAccess
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmergencyAccessRequest'}
      responses:
        '201': {description: Request recorded; no access until independent approval}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /administration/emergency-access-requests/{emergencyRequestId}/approval:
    post:
      tags: [Administration]
      operationId: decideEmergencyAccess
      parameters:
        - $ref: '#/components/parameters/EmergencyRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [APPROVE, REJECT]}
                reason: {type: string, minLength: 20, maxLength: 2000}
      responses:
        '200': {description: Decision by a different designated Platform Security Admin recorded; approval activates notification and automatic expiry}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /tenants/{tenantId}/emergency-access-grants/{emergencyRequestId}/revoke:
    post:
      tags: [Administration]
      operationId: revokeEmergencyAccessAsTenantAdmin
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/EmergencyRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': {description: Affected Tenant Admin revoked the grant without receiving content access}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    applicationSession:
      type: apiKey
      in: cookie
      name: __Host-enter_session
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
      description: Strong ETag from the latest authorized representation.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 200}
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ResumeId:
      name: resumeId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    RightsRequestId:
      name: rightsRequestId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    CandidateWorkId:
      name: candidateWorkId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    BusinessUnitId:
      name: businessUnitId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    OpeningId:
      name: openingId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    SearchId:
      name: searchId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    AccessReviewId:
      name: accessReviewId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    EmergencyRequestId:
      name: emergencyRequestId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
  headers:
    ETag:
      description: Strong version tag for optimistic concurrency.
      schema: {type: string}
    RetryAfter:
      description: Safe retry delay in seconds.
      schema: {type: integer, minimum: 1}
  responses:
    HandoffCreated:
      description: Private no-store token issuance; never persisted in generic idempotency responses
      headers:
        Cache-Control: {schema: {type: string, const: 'no-store, private'}}
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [token, expires_at, version, kind]
            properties:
              token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
              expires_at: {type: string, format: date-time}
              version: {type: integer, minimum: 1}
              kind: {type: string, enum: [criteria-review, search-results, comparison-selection]}
    Problem:
      description: RFC 9457 problem details with non-enumerating public text
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Authentication is missing, expired, revoked, or insufficiently assured
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Denied without confirming whether the tenant, actor, grant, or target exists
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource is absent or intentionally concealed from the caller
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationFailed:
      description: Request validation failed without changing stored state
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: Temporary abuse-protection delay; never a permanent automatic lockout
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    SafeDegradation:
      description: Optional service unavailable; core/manual path remains safe
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                properties:
                  fallback: {type: string, enum: [MANUAL_CRITERIA, MANUAL_PROFILE_ENTRY, RETRY_LATER]}
    Conflict:
      description: Stale write rejected; client must reconcile explicitly
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ConflictProblem'}
  schemas:
    OrderedSelection:
      type: array
      maxItems: 10
      uniqueItems: true
      items: {$ref: '#/components/schemas/Id'}
    HandoffState:
      type: object
      description: Search-results metadata includes applied source criteria under current bound restore authorization. Criteria-review remains the internal encrypted adjustment mechanism; the standard journey does not navigate to standalone review.
      additionalProperties: false
      required: [schema_version, kind, version, etag]
      properties:
        schema_version: {type: integer, const: 1}
        kind: {type: string, enum: [criteria-review, search-results, comparison-selection]}
        version: {type: integer, minimum: 1}
        etag: {type: string}
        workflow_id: {$ref: '#/components/schemas/Id'}
        workflow_version: {type: string}
        search_id: {$ref: '#/components/schemas/Id'}
        result_context_version: {type: string}
        page: {type: integer, minimum: 1}
        criteria: {$ref: '#/components/schemas/SearchCriteria'}
        candidate_ids: {$ref: '#/components/schemas/OrderedSelection'}
        return_path: {type: string, pattern: '^/tenants/[^/]+/recruiter/search/$'}
        estimated_count: {type: integer, minimum: 0}
        group_impacts:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              group_id: {$ref: '#/components/schemas/Id'}
              operator: {type: string, enum: [ANY, ALL]}
              estimated_count: {type: integer}
              alternate_operator: {type: string, enum: [ANY, ALL]}
              alternate_estimated_count: {type: integer}
    Id:
      type: string
      format: uuid
    BusinessUnit:
      type: object
      required: [id, tenant_id, name, status, version]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        tenant_id: {$ref: '#/components/schemas/Id'}
        name: {type: string, minLength: 1, maxLength: 300}
        description: {type: [string, 'null'], maxLength: 2000}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
        version: {type: integer, minimum: 1}
    Opening:
      type: object
      required: [id, tenant_id, business_unit_id, title, location, work_mode, employment_type, state, version]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        tenant_id: {$ref: '#/components/schemas/Id'}
        business_unit_id: {$ref: '#/components/schemas/Id'}
        title: {type: string, minLength: 1, maxLength: 300}
        location: {type: object}
        work_mode: {type: string, enum: [REMOTE, HYBRID, ON_SITE, FLEXIBLE]}
        employment_type: {type: string}
        description: {type: [string, 'null'], maxLength: 20000}
        hiring_team_ids: {type: array, items: {$ref: '#/components/schemas/Id'}}
        state: {type: string, enum: [DRAFT, OPEN, PAUSED, CLOSED]}
        version: {type: integer, minimum: 1}
    RecruiterEnteredCandidateCreate:
      type: object
      additionalProperties: false
      required: [display_name, location, experience_years, skills, confirm_synthetic]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 200}
        location: {type: object}
        experience_years: {type: number, minimum: 0, multipleOf: 0.01}
        skills: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        confirm_synthetic: {const: true}
    RecruiterEnteredCandidate:
      allOf:
        - $ref: '#/components/schemas/RecruiterEnteredCandidateCreate'
        - type: object
          required: [id, tenant_id, source_type, source_label, version]
          properties:
            id: {$ref: '#/components/schemas/Id'}
            tenant_id: {$ref: '#/components/schemas/Id'}
            source_type: {const: RECRUITER_ENTERED_SYNTHETIC}
            source_label: {const: Recruiter-entered synthetic record}
            version: {type: integer, minimum: 1}
    Session:
      type: object
      required: [actor_id, role, expires_at]
      properties:
        actor_id: {$ref: '#/components/schemas/Id'}
        role: {type: string, enum: [CANDIDATE, RECRUITER, HIRING_MANAGER, TENANT_ADMIN, PLATFORM_SECURITY_ADMIN]}
        tenant_id: {anyOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]}
        expires_at: {type: string, format: date-time}
    CandidateProfile:
      type: object
      required: [id, full_name, location, experience_years, skills, employment_history, profile_state, visibility, version]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        full_name: {type: string, maxLength: 200}
        location: {type: object}
        headline: {type: [string, 'null'], maxLength: 300}
        current_role: {type: [string, 'null'], maxLength: 200}
        current_company: {type: [string, 'null'], maxLength: 200}
        experience_years: {type: number, minimum: 0, multipleOf: 0.01}
        skills: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        employment_history:
          type: array
          items: {$ref: '#/components/schemas/EmploymentRecord'}
        role_categories: {type: array, items: {type: string}}
        preferred_locations: {type: array, items: {type: string}}
        work_arrangements: {type: array, items: {type: string, enum: [FLEXIBLE, REMOTE, HYBRID, ON_SITE]}}
        meaningful_work: {type: [string, 'null'], maxLength: 300}
        notice_period: {type: [string, 'null']}
        availability_date: {type: [string, 'null'], format: date}
        compensation:
          anyOf:
            - type: object
              required: [currency, amount_minor, period]
              properties:
                currency: {type: string, pattern: '^[A-Z]{3}$'}
                amount_minor: {type: integer, minimum: 0}
                period: {type: string, enum: [HOUR, DAY, MONTH, YEAR]}
            - type: 'null'
        professional_links: {type: array, items: {type: string, format: uri, pattern: '^https?://'}}
        contact_preferences: {type: object}
        profile_state: {type: string, enum: [DRAFT, REVIEW_REQUIRED, PUBLISHED, HIDDEN, DELETION_PENDING, DELETED]}
        visibility: {$ref: '#/components/schemas/Visibility'}
        version: {type: integer, minimum: 1}
    CandidateProfilePatch:
      type: object
      additionalProperties: false
      properties:
        full_name: {type: string, maxLength: 200}
        location: {type: object}
        headline: {type: [string, 'null'], maxLength: 300}
        current_role: {type: [string, 'null'], maxLength: 200}
        current_company: {type: [string, 'null'], maxLength: 200}
        experience_years: {type: number, minimum: 0, multipleOf: 0.01}
        skills: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        employment_history:
          type: array
          items: {$ref: '#/components/schemas/EmploymentRecordInput'}
        role_categories: {type: array, items: {type: string}}
        preferred_locations: {type: array, items: {type: string}}
        work_arrangements: {type: array, items: {type: string, enum: [FLEXIBLE, REMOTE, HYBRID, ON_SITE]}}
        meaningful_work: {type: [string, 'null'], maxLength: 300}
        notice_period: {type: [string, 'null']}
        availability_date: {type: [string, 'null'], format: date}
        compensation:
          anyOf:
            - type: object
              required: [currency, amount_minor, period]
              properties:
                currency: {type: string, pattern: '^[A-Z]{3}$'}
                amount_minor: {type: integer, minimum: 0}
                period: {type: string, enum: [HOUR, DAY, MONTH, YEAR]}
            - type: 'null'
        professional_links: {type: array, items: {type: string, format: uri, pattern: '^https?://'}}
        contact_preferences: {type: object}
    Visibility:
      type: object
      required: [mode, version]
      properties:
        mode: {type: string, enum: [APPROVED_RECRUITERS, MATCHING_ROLES, APPLIED_ROLES_ONLY, NOT_LOOKING]}
        approved_tenant_ids:
          type: array
          items: {$ref: '#/components/schemas/Id'}
        matching_preferences:
          type: object
          description: Deterministic candidate-controlled role, location, work-arrangement, and other eligibility preferences used only for MATCHING_ROLES.
        version: {type: integer, minimum: 1}
      allOf:
        - if:
            properties: {mode: {const: APPROVED_RECRUITERS}}
          then:
            required: [approved_tenant_ids]
            properties: {approved_tenant_ids: {minItems: 1}}
        - if:
            properties: {mode: {const: MATCHING_ROLES}}
          then:
            required: [matching_preferences]
            properties: {matching_preferences: {minProperties: 1}}
    VisibilityChange:
      oneOf:
        - type: object
          required: [mode, consent_record_id, approved_tenant_ids]
          properties:
            mode: {const: APPROVED_RECRUITERS}
            approved_tenant_ids: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Id'}}
            consent_record_id: {$ref: '#/components/schemas/Id'}
          additionalProperties: false
        - type: object
          required: [mode, consent_record_id, matching_preferences]
          properties:
            mode: {const: MATCHING_ROLES}
            matching_preferences: {type: object, minProperties: 1, description: Deterministic candidate-controlled eligibility preferences; AI cannot satisfy them.}
            consent_record_id: {$ref: '#/components/schemas/Id'}
          additionalProperties: false
        - type: object
          required: [mode, consent_record_id]
          properties:
            mode: {type: string, enum: [APPLIED_ROLES_ONLY, NOT_LOOKING]}
            consent_record_id: {$ref: '#/components/schemas/Id'}
          additionalProperties: false
    ResumeState:
      type: object
      required: [id, scan_status, parse_status]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        scan_status: {type: string, enum: [UPLOADING, SCANNING, CLEAN, SCAN_FAILED, REJECTED]}
        parse_status: {type: string, enum: [NOT_STARTED, PARSING, REVIEW_REQUIRED, READY, PARSE_FAILED]}
        manual_entry_available: {type: boolean}
        suggestions: {type: array, items: {type: object}}
    Application:
      type: object
      required: [id, opening_id, resume_id, candidate_status, notification_preferences, version]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        opening_id: {$ref: '#/components/schemas/Id'}
        resume_id: {$ref: '#/components/schemas/Id'}
        candidate_status: {$ref: '#/components/schemas/CandidateFacingStatus'}
        notification_preferences:
          type: object
          required: [email, whatsapp]
          properties:
            email: {type: boolean}
            whatsapp: {type: boolean}
        notification_states:
          type: array
          items: {$ref: '#/components/schemas/CandidateNotificationState'}
        version: {type: integer, minimum: 1}
    SearchInterpretation:
      type: object
      required: [original_prompt, criteria, requires_review, ai_status]
      properties:
        original_prompt: {type: string}
        criteria: {$ref: '#/components/schemas/SearchCriteria'}
        requires_review:
          type: boolean
          description: Blocks standard execution and requires safe inline clarification on search home; never silently approve or force standalone review navigation.
        ambiguities: {type: array, items: {type: string}}
        ai_status: {type: string, enum: [USED, NOT_NEEDED, UNAVAILABLE, INVALID_OUTPUT]}
    SearchCriteria:
      type: object
      required: [context, groups, criteria]
      properties:
        context: {$ref: '#/components/schemas/SearchContext'}
        groups:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/CriteriaGroup'}
        criteria:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Criterion'}
        cursor: {type: [string, 'null']}
        limit: {type: integer, minimum: 1, maximum: 100, default: 25}
      description: Group and criterion IDs must be unique within the search; every criterion.group_id must reference exactly one submitted group. These cross-reference and active-opening invariants are enforced by the service.
      example:
        context: {type: OPENING, opening_id: 018f62f4-7c42-7e8a-b810-0a65d77be112}
        groups:
          - {id: 018f62f4-7c42-7e8a-b810-0a65d77be201, purpose: REQUIREMENT, operator: ALL, label: Core fit}
          - {id: 018f62f4-7c42-7e8a-b810-0a65d77be202, purpose: PREFERENCE, operator: ANY, label: Preferred skills}
        criteria:
          - {id: 018f62f4-7c42-7e8a-b810-0a65d77be301, group_id: 018f62f4-7c42-7e8a-b810-0a65d77be201, field: location, operator: EQ, value: Bengaluru}
          - {id: 018f62f4-7c42-7e8a-b810-0a65d77be302, group_id: 018f62f4-7c42-7e8a-b810-0a65d77be202, field: skill, operator: CONTAINS, value: Python}
        limit: 25
    SearchContext:
      oneOf:
        - type: object
          required: [type]
          properties:
            type: {const: AD_HOC}
          additionalProperties: false
        - type: object
          required: [type, opening_id]
          properties:
            type: {const: OPENING}
            opening_id: {$ref: '#/components/schemas/Id'}
          additionalProperties: false
      description: This is the sole authoritative search context. OPENING contains exactly one opening_id and must resolve to an active tenant-owned opening at execution. AD_HOC contains no opening_id. Only OPENING can discover MATCHING_ROLES; AD_HOC is limited to an explicit APPROVED_RECRUITERS audience.
    CriteriaGroup:
      type: object
      required: [id, purpose, operator]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        purpose: {type: string, enum: [REQUIREMENT, PREFERENCE, EXCLUSION]}
        operator: {type: string, enum: [ANY, ALL]}
        label: {type: [string, 'null'], maxLength: 200}
      additionalProperties: false
    Criterion:
      type: object
      required: [id, group_id, field, operator, value]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        group_id: {$ref: '#/components/schemas/Id'}
        field: {type: string, minLength: 1, maxLength: 100}
        operator: {type: string, enum: [EQ, NE, LT, LTE, GT, GTE, IN, NOT_IN, CONTAINS, EXISTS]}
        value: {}
      additionalProperties: false
    EmploymentRecord:
      type: object
      required: [id, company, start_date, end_date, start_date_state, end_date_state, is_current, employment_type, employment_type_state, provenance, version]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        company: {type: string, minLength: 1, maxLength: 300}
        role_title: {type: [string, 'null'], maxLength: 300}
        start_date: {type: [string, 'null'], format: date}
        end_date: {type: [string, 'null'], format: date}
        start_date_state: {type: string, enum: [CONFIRMED, SUGGESTED, AMBIGUOUS, MISSING]}
        end_date_state: {type: string, enum: [CONFIRMED, SUGGESTED, AMBIGUOUS, MISSING]}
        is_current: {type: boolean}
        employment_type:
          type: string
          enum: [PERMANENT, INTERNSHIP, APPRENTICESHIP, FIXED_TERM_CONTRACT, CONSULTING, SEASONAL, OTHER_TEMPORARY, OTHER, UNKNOWN]
        employment_type_state: {type: string, enum: [CONFIRMED, SUGGESTED, AMBIGUOUS, MISSING]}
        provenance: {type: string, enum: [CANDIDATE_REPORTED, RESUME_EXTRACTED]}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        source_spans:
          type: array
          items:
            type: object
            required: [resume_id, start_offset, end_offset]
            properties:
              resume_id: {$ref: '#/components/schemas/Id'}
              page: {type: [integer, 'null'], minimum: 1}
              start_offset: {type: integer, minimum: 0}
              end_offset: {type: integer, minimum: 0}
            additionalProperties: false
        version: {type: integer, minimum: 1}
      allOf:
        - if:
            properties: {is_current: {const: true}}
            required: [is_current]
          then:
            properties:
              end_date: {type: 'null'}
        - if:
            properties: {start_date_state: {const: CONFIRMED}}
            required: [start_date_state]
          then:
            properties:
              start_date: {type: string, format: date}
        - if:
            properties: {end_date_state: {const: CONFIRMED}}
            required: [end_date_state]
          then:
            properties:
              end_date: {type: string, format: date}
      additionalProperties: false
      description: Current roles require a null end_date. Only candidate-accepted/corrected CONFIRMED values are eligible for deterministic finding evaluation; missing values and reasons for departure are never inferred.
    EmploymentRecordInput:
      type: object
      required: [company, start_date, end_date, start_date_state, end_date_state, is_current, employment_type, employment_type_state, provenance]
      properties:
        id:
          anyOf: [{$ref: '#/components/schemas/Id'}, {type: 'null'}]
          description: Existing record ID for correction; null or absent creates a server-assigned stable ID.
        company: {type: string, minLength: 1, maxLength: 300}
        role_title: {type: [string, 'null'], maxLength: 300}
        start_date: {type: [string, 'null'], format: date}
        end_date: {type: [string, 'null'], format: date}
        start_date_state: {type: string, enum: [CONFIRMED, SUGGESTED, AMBIGUOUS, MISSING]}
        end_date_state: {type: string, enum: [CONFIRMED, SUGGESTED, AMBIGUOUS, MISSING]}
        is_current: {type: boolean}
        employment_type:
          type: string
          enum: [PERMANENT, INTERNSHIP, APPRENTICESHIP, FIXED_TERM_CONTRACT, CONSULTING, SEASONAL, OTHER_TEMPORARY, OTHER, UNKNOWN]
        employment_type_state: {type: string, enum: [CONFIRMED, SUGGESTED, AMBIGUOUS, MISSING]}
        provenance: {type: string, enum: [CANDIDATE_REPORTED, RESUME_EXTRACTED]}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 1}
        source_spans:
          type: array
          items:
            type: object
            required: [resume_id, start_offset, end_offset]
            properties:
              resume_id: {$ref: '#/components/schemas/Id'}
              page: {type: [integer, 'null'], minimum: 1}
              start_offset: {type: integer, minimum: 0}
              end_offset: {type: integer, minimum: 0}
            additionalProperties: false
      allOf:
        - if:
            properties: {is_current: {const: true}}
            required: [is_current]
          then:
            properties:
              end_date: {type: 'null'}
        - if:
            properties: {start_date_state: {const: CONFIRMED}}
            required: [start_date_state]
          then:
            properties:
              start_date: {type: string, format: date}
        - if:
            properties: {end_date_state: {const: CONFIRMED}}
            required: [end_date_state]
          then:
            properties:
              end_date: {type: string, format: date}
      additionalProperties: false
      description: Missing or ambiguous values remain explicit. The service rejects confirmed completed records without valid complete dates and never accepts or derives a reason for departure.
    SearchResult:
      type: object
      required: [candidate_id, evidence, findings, unknowns]
      properties:
        candidate_id: {$ref: '#/components/schemas/Id'}
        summary: {type: object}
        evidence:
          type: array
          items:
            type: object
            required: [evidence_id, label, provenance]
