{{ page_bootstrap|json_script:"page-bootstrap" }}
<div data-page-csrf hidden>{% csrf_token %}</div>
<div data-react-page></div>
<main data-page-fallback tabindex="-1" aria-label="Page recovery" hidden>
  <h1>Criteria review is unavailable</h1>
  <p>Reload to retry. This recovery page does not run a search.</p>
  {% if tenant_id %}
  <a href="{% url 'recruiter-search-page' tenant_id=tenant_id %}"
    >Return to search</a
  >
  {% else %}<a href="/">Return to platform selection</a>{% endif %}
</main>
