{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Enter</title>
    <link
      rel="stylesheet"
      href="{% static frontend_style|default:'dist/assets/app.css' %}"
    />
  </head>
  <!-- prettier-ignore -->
  <body data-frontend-renderer="{{ frontend_renderer|default:'legacy' }}">
    {% if frontend_renderer == 'react' %}
    {% include frontend_template %}
    {% else %}
    <a class="skip-link" href="#main">Skip to main content</a>
    <!-- prettier-ignore -->
    <main id="main" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    {% endif %}
    <script
      type="module"
      src="{% static frontend_script|default:'dist/assets/app.js' %}"
    ></script>
  </body>
</html>
