{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ page_title|default:"Enter — find work that fits" }}</title>
    <meta
      name="description"
      content="{{ page_description|default:'Candidate-controlled profiles, open roles and human-led recruiting.' }}"
    />
    {% if page_url %}
    <link rel="canonical" href="{{ page_url }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Enter" />
    <meta property="og:title" content="{{ page_title }}" />
    <meta property="og:description" content="{{ page_description }}" />
    <meta property="og:url" content="{{ page_url }}" />
    <meta name="twitter:card" content="summary_large_image" />
    {% if page_image %}
    <meta property="og:image" content="{{ page_image }}" />
    <meta name="twitter:image" content="{{ page_image }}" />
    {% endif %} {% endif %}
    <link
      rel="stylesheet"
      href="{% static frontend_style|default:'dist/assets/app.css' %}{% if frontend_asset_version %}?v={{ frontend_asset_version }}{% endif %}"
    />
  </head>
  <!-- prettier-ignore -->
  <body data-frontend-renderer="{{ frontend_renderer|default:'legacy' }}">
    {% if frontend_renderer == 'react' %}
    {% include frontend_template %}
    <noscript>
      <main aria-label="JavaScript required">
        <h1>JavaScript is required</h1>
        <p>Enable JavaScript and reload this page to use Enter.</p>
      </main>
    </noscript>
    {% else %}
    <a class="skip-link" href="#main">Skip to main content</a>
    <!-- prettier-ignore -->
    <main id="main" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    {% endif %}
    <script
      type="module"
      src="{% static frontend_script|default:'dist/assets/app.js' %}{% if frontend_asset_version %}?v={{ frontend_asset_version }}{% endif %}"
    ></script>
  </body>
</html>
