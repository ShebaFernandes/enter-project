services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: enter
      POSTGRES_USER: enter
      POSTGRES_PASSWORD: enter
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enter -d enter"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  valkey:
    image: valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    ports: ["6379:6379"]
  s3-local:
    image: localstack/localstack:4.9.2@sha256:59373b4a27dba3ec15c4db0b7455f0cb68c8a42300e2cbbe362b440f9a131697
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-south-1
    ports: ["4566:4566"]
    volumes:
      - s3_data:/var/lib/localstack
      - ./app/docker/localstack:/etc/localstack/init/ready.d:ro
  mail:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    ports: ["1025:1025", "8025:8025"]
  web:
    build: {context: ./app, target: runtime}
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-south-1
      S3_ENDPOINT_URL: http://localhost:4566
      RESUME_QUARANTINE_BUCKET: enter-resume-quarantine
    command: ["web"]
    volumes:
      - ./app:/workspace/app
      - ./specs:/workspace/specs:ro
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_started}
      s3-local: {condition: service_started}
  worker:
    build: {context: ./app, target: runtime}
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-south-1
      S3_ENDPOINT_URL: http://s3-local:4566
      RESUME_QUARANTINE_BUCKET: enter-resume-quarantine
    command: ["worker"]
    volumes: ["./app:/workspace/app"]
    depends_on:
      postgres: {condition: service_healthy}
      s3-local: {condition: service_started}
volumes:
  postgres_data:
  s3_data:
